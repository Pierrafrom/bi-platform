name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python quality: ruff + mypy
  # ---------------------------------------------------------------------------
  lint-and-type-check:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-dev

      - name: Ruff lint
        run: uv run ruff check airflow/ pipeline/ tests/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check airflow/ pipeline/ tests/

      - name: Mypy
        # airflow/dags/ excluded (see pyproject.toml [tool.mypy] exclude)
        run: uv run mypy pipeline/

  # ---------------------------------------------------------------------------
  # Python tests
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --only-dev

      - name: Run pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # SQL quality: sqlfluff (Snowflake dialect)
  # Runs whenever dbt/models/ files change — on push and on PRs
  # ---------------------------------------------------------------------------
  sqlfluff:
    name: SQL lint (sqlfluff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Check for dbt model changes
        id: sql_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
          else
            BASE="${{ github.event.before }}"
            # On the very first push (no previous commit), lint everything
            [ "$BASE" = "0000000000000000000000000000000000000000" ] && BASE=""
          fi
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE"...HEAD | grep -q '^dbt/models/' \
              && echo "changed=true" >> "$GITHUB_OUTPUT" \
              || echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.sql_changed.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        if: steps.sql_changed.outputs.changed == 'true'
        run: uv sync

      - name: sqlfluff lint
        if: steps.sql_changed.outputs.changed == 'true'
        working-directory: dbt/
        run: uv run sqlfluff lint models/ --dialect=snowflake --templater=jinja

  # ---------------------------------------------------------------------------
  # dbt: parse check (no Snowflake connection needed)
  # dbt parse validates models, sources, macros and generates manifest.json
  # without attempting a database connection — unlike dbt compile.
  # Runs on push to any branch and on PRs when dbt/ files change.
  # ---------------------------------------------------------------------------
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check for dbt changes
        id: dbt_changed
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="origin/${{ github.base_ref }}"
            git fetch origin "${{ github.base_ref }}" --depth=1
          else
            BASE="${{ github.event.before }}"
            [ "$BASE" = "0000000000000000000000000000000000000000" ] && BASE=""
          fi
          if [ -z "$BASE" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only "$BASE"...HEAD | grep -q '^dbt/' \
              && echo "changed=true" >> "$GITHUB_OUTPUT" \
              || echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up uv
        if: steps.dbt_changed.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dbt
        if: steps.dbt_changed.outputs.changed == 'true'
        run: uv sync

      - name: Write dbt profiles
        if: steps.dbt_changed.outputs.changed == 'true'
        # Uses a dummy Snowflake profile — compile only, no connection made
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          bi_platform:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: dummy
                user: dummy
                password: dummy
                role: dummy
                database: HOPITAL_DW
                warehouse: dummy
                schema: STG
                threads: 1
          EOF

      - name: dbt deps
        if: steps.dbt_changed.outputs.changed == 'true'
        working-directory: dbt/
        run: uv run dbt deps

      - name: dbt parse
        if: steps.dbt_changed.outputs.changed == 'true'
        working-directory: dbt/
        run: uv run dbt parse --profiles-dir ~/.dbt
