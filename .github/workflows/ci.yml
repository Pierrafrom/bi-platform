name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  # Python quality: ruff + mypy
  # ---------------------------------------------------------------------------
  lint-and-type-check:
    name: Lint & type check
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dev dependencies
        run: uv sync --only-dev

      - name: Ruff lint
        run: uv run ruff check airflow/ pipeline/ tests/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format --check airflow/ pipeline/ tests/

      - name: Mypy
        # airflow/dags/ excluded (see pyproject.toml [tool.mypy] exclude)
        run: uv run mypy pipeline/

  # ---------------------------------------------------------------------------
  # Python tests
  # ---------------------------------------------------------------------------
  tests:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lint-and-type-check

    steps:
      - uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --only-dev

      - name: Run pytest
        run: uv run pytest

  # ---------------------------------------------------------------------------
  # dbt: compile check (no Snowflake connection needed)
  # Runs only when dbt models change
  # ---------------------------------------------------------------------------
  dbt-compile:
    name: dbt compile
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Run on PRs only; detect dbt/ changes via git diff against main
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0  # needed for git diff against base branch

      - name: Check for dbt changes
        id: dbt_changed
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -q '^dbt/' \
            && echo "changed=true" >> "$GITHUB_OUTPUT" \
            || echo "changed=false" >> "$GITHUB_OUTPUT"

      - name: Set up uv
        if: steps.dbt_changed.outputs.changed == 'true'
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Install dbt
        if: steps.dbt_changed.outputs.changed == 'true'
        run: uv sync

      - name: Write dbt profiles
        if: steps.dbt_changed.outputs.changed == 'true'
        # Uses a dummy Snowflake profile — compile only, no connection made
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml << 'EOF'
          bi_platform:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: dummy
                user: dummy
                password: dummy
                role: dummy
                database: BI_PLATFORM
                warehouse: dummy
                schema: STAGING
                threads: 1
          EOF

      - name: dbt deps
        if: steps.dbt_changed.outputs.changed == 'true'
        working-directory: dbt/
        run: uv run dbt deps

      - name: dbt compile
        if: steps.dbt_changed.outputs.changed == 'true'
        working-directory: dbt/
        run: uv run dbt compile --profiles-dir ~/.dbt
