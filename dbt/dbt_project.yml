name: "bi_platform"
version: "1.0.0"
config-version: 2

profile: "bi_platform"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bi_platform:
    # Staging — raw ingestion, views, no business logic
    staging:
      +schema: stg
      +materialized: view
      +tags: ["staging"]

    # Intermediate — three sub-layers each with their own Snowflake schema
    intermediate:
      # OBS: raw archive of each daily batch (source of truth for replay)
      obs:
        +schema: obs
        +materialized: table
        +tags: ["obs"]
      # WRK: quality control, dedup, normalisation (Travail layer)
      wrk:
        +schema: wrk
        +materialized: table
        +tags: ["wrk"]
      # REJ: rejected rows with error code and reason
      rej:
        +schema: rej
        +materialized: table
        +tags: ["rej"]

    # Marts — fact + dimension tables for Power BI (Socle layer)
    marts:
      +schema: soc
      +materialized: table
      +tags: ["socle"]
    
    # Vues — KPI views consumed by Power BI (Lot 4)
    vues:
      +schema: vw
      +materialized: view
      +tags: ["vues"]

vars:
  batch_date: "1970-01-01"
  exec_id: -1
