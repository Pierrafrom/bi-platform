name: "bi_platform"
version: "1.0.0"
config-version: 2

profile: "bi_platform"

model-paths: ["models"]
seed-paths: ["seeds"]
test-paths: ["tests"]
macro-paths: ["macros"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets: ["target", "dbt_packages"]

models:
  bi_platform:
    # Staging — raw ingestion, views, no business logic
    staging:
      +schema: staging
      +materialized: view
      +tags: ["staging"]

    # Intermediate — quality, unification, joins (Travail layer)
    intermediate:
      +schema: travail
      +materialized: view
      +tags: ["travail"]

    # Marts — fact + dimension tables for Power BI (Socle/Vue layer)
    marts:
      +schema: socle
      +materialized: table
      +tags: ["socle"]
