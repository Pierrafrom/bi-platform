version: 2

models:
  - name: r_room
    description: >
      SOC reference table for hospital rooms.
      Natural PK: ROOM_NUM. Loaded from wrk_chambre (OK rows only).
    columns:
      - name: ROOM_NUM
        description: "Room number — natural primary key."
        tests: [not_null, unique]
      - name: ROOM_NAME
        description: "Room name."
        tests: [not_null]
      - name: FLOR_NUM
        description: "Floor number."
      - name: BULD_NAME
        description: "Building name."
      - name: ROOM_TYP
        description: "Room type (single, double, etc.)."
      - name: ROOM_DAY_RATE
        description: "Daily rate in euros — must be strictly positive."
        tests: [not_null]
      - name: CRTN_DT
        description: "Room creation date."
        tests: [not_null]
      - name: EXEC_ID
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_medc
    description: >
      SOC reference table for medications.
      Surrogate key MEDC_ID generated via ROW_NUMBER on composite business key
      (MEDC_CD, MEDC_CATG, MANF_BRND). Never use IDENTITY Snowflake here.
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns:
            - MEDC_CD
            - MEDC_CATG
            - MANF_BRND
    columns:
      - name: MEDC_ID
        description: "Surrogate key — generated by ROW_NUMBER, not IDENTITY."
        tests: [not_null, unique]
      - name: MEDC_CD
        description: "Medication code."
        tests: [not_null]
      - name: MEDC_NAME
        description: "Medication name."
      - name: MEDC_COND
        description: "Packaging / conditioning."
      - name: MEDC_CATG
        description: "Medication category."
        tests: [not_null]
      - name: MANF_BRND
        description: "Manufacturer brand."
        tests: [not_null]
      - name: EXEC_ID
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_part
    description: >
      Unified party reference table for patients and personnel.
      The surrogate key is generated deterministically from SRC_TYP and SRC_ID.
    columns:
      - name: part_id
        description: "Deterministic surrogate key for a party."
        tests: [not_null, unique]
      - name: src_id
        description: "Source identifier from PATIENT or PERSONNEL."
        tests: [not_null]
      - name: src_typ
        description: "Party type: Patient or personnel job title."
        tests: [not_null]
      - name: exec_id
        description: "Pipeline execution identifier."
        tests: [not_null]

  - name: r_indiv
    description: >
      SOC reference table for individual (patient) identity.
      One row per patient. Loaded from wrk_patient OK rows only.
      FK to r_part via indiv_id / src_id where src_typ = 'Patient'.
    columns:
      - name: indiv_id
        description: "Patient identifier — natural PK."
        tests: [not_null, unique]
      - name: last_name
        description: "Patient last name."
        tests: [not_null]
      - name: first_name
        description: "Patient first name."
        tests: [not_null]
      - name: social_security_number
        description: "French social security number (nullable)."
      - name: birth_date
        description: "Date of birth."
      - name: birth_city
        description: "City of birth."
      - name: birth_country
        description: "Country of birth."
      - name: created_at
        description: "Row creation timestamp."
        tests: [not_null]
      - name: updated_at
        description: "Last update timestamp."
        tests: [not_null]
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_stf
    description: >
      SOC reference table for staff (personnel) identity.
      One row per staff member. Loaded from wrk_personnel OK rows only.
      FK to r_part via staff_id / src_id where src_typ = job_title.
    columns:
      - name: staff_id
        description: "Staff identifier — natural PK."
        tests: [not_null, unique]
      - name: last_name
        description: "Staff last name."
        tests: [not_null]
      - name: first_name
        description: "Staff first name."
        tests: [not_null]
      - name: job_title
        description: "Function in the hospital."
        tests: [not_null]
      - name: work_start_at
        description: "Activity start timestamp."
        tests: [not_null]
      - name: work_end_at
        description: "Activity end timestamp. Nullable for active staff."
      - name: work_end_reason
        description: "Reason for activity end."
      - name: status_code
        description: "Personnel status code."
        tests: [not_null]
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_addr
    description: >
      SOC reference table for postal addresses.
      One row per patient with at least one address field populated.
      Derived from wrk_patient OK rows.
    columns:
      - name: indiv_id
        description: "Patient identifier — FK to r_indiv."
        tests: [not_null, unique]
      - name: street_number
        description: "Street number."
      - name: street_name
        description: "Street name."
      - name: address_complement
        description: "Address complement."
      - name: postal_code
        description: "Postal / zip code."
      - name: city
        description: "City."
      - name: country
        description: "Country."
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_tel
    description: >
      SOC reference table for phone numbers.
      One row per patient with a non-null phone number.
      Derived from wrk_patient OK rows.
    columns:
      - name: indiv_id
        description: "Patient identifier — FK to r_indiv."
        tests: [not_null, unique]
      - name: phone_country_code
        description: "Country dial prefix."
      - name: phone_number
        description: "Phone number."
        tests: [not_null]
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_trmt
    description: >
      SOC reference table for treatments.
      One row per treatment. Loaded from wrk_traitement OK rows only.
    columns:
      - name: treatment_id
        description: "Treatment identifier — natural PK."
        tests: [not_null, unique]
      - name: consultation_id
        description: "FK to fait_consult."
        tests: [not_null]
      - name: medicine_code
        description: "Medication code."
        tests: [not_null]
      - name: medicine_category
        description: "Medication category."
        tests: [not_null]
      - name: manufacturer_brand
        description: "Manufacturer brand."
        tests: [not_null]
      - name: medicine_quantity
        description: "Prescribed quantity."
      - name: dosage_description
        description: "Dosage instructions."
      - name: created_at
        description: "Treatment creation timestamp."
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: r_hospi
    description: >
      SOC table for hospitalisations.
      One row per hospitalisation. Loaded from wrk_hospitalisation OK rows only.
      Includes derived duration_days field.
    columns:
      - name: hospi_id
        description: "Hospitalisation identifier — natural PK."
        tests: [not_null, unique]
      - name: consultation_id
        description: "FK to fait_consult."
        tests: [not_null]
      - name: room_number
        description: "Room number — FK to r_room."
        tests: [not_null]
      - name: responsible_staff_id
        description: "Responsible staff member — FK to r_stf."
      - name: started_at
        description: "Hospitalisation start timestamp."
        tests: [not_null]
      - name: ended_at
        description: "Hospitalisation end timestamp. Nullable for ongoing stays."
      - name: duration_days
        description: >
          Derived: DATEDIFF day between started_at and ended_at.
          NULL for ongoing stays (ended_at IS NULL).
      - name: cost
        description: "Total cost in euros."
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]

  - name: fait_consult
    description: >
      SOC fact table for consultations — central grain of the star schema.
      One row per consultation. Loaded from wrk_consultation OK rows only.
      Includes derived duration_minutes field.
    columns:
      - name: consultation_id
        description: "Consultation identifier — natural PK."
        tests: [not_null, unique]
      - name: patient_id
        description: "FK to r_indiv."
        tests:
          - not_null
          - relationships:
              to: ref('r_indiv')
              field: indiv_id
      - name: staff_id
        description: "FK to r_stf."
        tests:
          - not_null
          - relationships:
              to: ref('r_stf')
              field: staff_id
      - name: treatment_id
        description: "FK to r_trmt. Nullable — not all consultations have a treatment."
        tests:
          - relationships:
              to: ref('r_trmt')
              field: treatment_id
              config:
                where: "treatment_id IS NOT NULL"
      - name: started_at
        description: "Consultation start timestamp."
        tests: [not_null]
      - name: ended_at
        description: "Consultation end timestamp."
      - name: duration_minutes
        description: >
          Derived: DATEDIFF minute between started_at and ended_at.
          NULL for consultations without an end timestamp.
      - name: patient_weight_kg
        description: "Patient weight in kg."
      - name: patient_temperature
        description: "Patient temperature."
      - name: temperature_unit
        description: "Temperature unit (C or F)."
      - name: blood_pressure
        description: "Blood pressure reading."
      - name: pathology_description
        description: "Diagnosed pathology."
      - name: diabetes_indicator
        description: "Diabetes indicator flag."
      - name: hospitalisation_indicator
        description: "Whether the consultation led to a hospitalisation."
      - name: exec_id
        description: "Execution ID — FK to TCH.T_SUIV_TRMT."
        tests: [not_null]
