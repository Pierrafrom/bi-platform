version: 2

models:
  - name: stg_patient
    description: >
      Cleaned and renamed patient records from the Staging layer.
      Type casting only — no business logic.
    columns:
      - name: patient_id
        description: "Unique patient identifier (source: ID_PATIENT)."
        tests: [not_null, unique]
      - name: last_name
        description: "Patient last name."
        tests: [not_null]
      - name: first_name
        description: "Patient first name."
        tests: [not_null]
      - name: social_security_number
        description: "French social security number (nullable — not always provided)."
      - name: birth_date
        description: "Date of birth, cast to DATE."
      - name: birth_city
        description: "City of birth."
      - name: birth_country
        description: "Country of birth."
      - name: phone_number
        description: "Phone number."
      - name: phone_country_code
        description: "Country dial prefix."
      - name: street_number
        description: "Street number."
      - name: street_name
        description: "Street name."
      - name: address_complement
        description: "Address complement (apartment, floor, etc.)."
      - name: postal_code
        description: "Postal / zip code."
      - name: city
        description: "City of residence."
      - name: country
        description: "Country of residence."
      - name: created_at
        description: "Row creation timestamp in the source system."
        tests: [not_null]
      - name: updated_at
        description: "Last update timestamp in the source system."
        tests: [not_null]

  - name: stg_chambre
    description: >
      Cleaned and renamed hospital room records from the Staging layer.
      Type casting only — no business logic.
    columns:
      - name: room_number
        description: "Room number — natural PK (source: NO_CHAMBRE)."
        tests: [not_null, unique]
      - name: room_name
        description: "Room name."
        tests: [not_null]
      - name: floor_number
        description: "Floor number."
      - name: building_name
        description: "Building name."
      - name: room_type
        description: "Room type (single, double, etc.)."
      - name: day_rate
        description: "Daily rate in euros."
        tests: [not_null]
      - name: created_date
        description: "Room creation date, cast to DATE."
        tests: [not_null]

  - name: stg_medicament
    description: >
      Cleaned and renamed medication records from the Staging layer.
      Type casting only — no business logic.
      PK is composite: (medicine_code, medicine_category, manufacturer_brand).
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - medicine_code
              - medicine_category
              - manufacturer_brand
    columns:
      - name: medicine_code
        description: "Medication code — part of composite PK (source: CD_MEDICAMENT)."
        tests: [not_null]
      - name: medicine_category
        description: "Medication category — part of composite PK (source: CATG_MEDICAMENT)."
        tests: [not_null]
      - name: manufacturer_brand
        description: "Manufacturer brand — part of composite PK (source: MARQUE_FABRI)."
        tests: [not_null]
      - name: medicine_name
        description: "Medication name."
      - name: medicine_packaging
        description: "Packaging / conditioning description."

  - name: stg_consultation
    description: >
      Cleaned and renamed consultation records from the Staging layer.
      Type casting only — no business logic.
    columns:
      - name: consultation_id
        description: "Unique consultation identifier (source: ID_CONSULT)."
        tests: [not_null, unique]
      - name: patient_id
        description: "FK to patient (source: ID_PATIENT)."
        tests: [not_null]
      - name: staff_id
        description: "FK to staff (source: ID_PERSONNEL)."
        tests: [not_null]
      - name: treatment_id
        description: "FK to treatment (source: ID_TRAITEMENT). Nullable."
      - name: started_at
        description: "Consultation start timestamp."
      - name: ended_at
        description: "Consultation end timestamp. Nullable."
      - name: patient_weight_kg
        description: "Patient weight in kg at time of consultation."
      - name: patient_temperature
        description: "Patient temperature at time of consultation."
      - name: temperature_unit
        description: "Temperature unit (C or F)."
      - name: blood_pressure
        description: "Patient blood pressure."
      - name: pathology_description
        description: "Description of the diagnosed pathology."
      - name: diabetes_indicator
        description: "Diabetes indicator flag."
      - name: hospitalisation_indicator
        description: "Whether the consultation led to a hospitalisation."

  - name: stg_traitement
    description: >
      Cleaned and renamed treatment records from the Staging layer.
      Type casting only — no business logic.
    columns:
      - name: treatment_id
        description: "Unique treatment identifier (source: ID_TRAITEMENT)."
        tests: [not_null, unique]
      - name: consultation_id
        description: "FK to consultation (source: ID_CONSULT)."
        tests: [not_null]
      - name: medicine_code
        description: "Medication code (source: CD_MEDICAMENT)."
        tests: [not_null]
      - name: medicine_category
        description: "Medication category (source: CATG_MEDICAMENT)."
        tests: [not_null]
      - name: manufacturer_brand
        description: "Manufacturer brand (source: MARQUE_FABRI)."
        tests: [not_null]
      - name: medicine_quantity
        description: "Prescribed quantity."
      - name: dosage_description
        description: "Dosage instructions."
      - name: created_at
        description: "Treatment creation timestamp."

  - name: stg_hospitalisation
    description: >
      Cleaned and renamed hospitalisation records from the Staging layer.
      Type casting only — no business logic.
    columns:
      - name: hospi_id
        description: "Unique hospitalisation identifier (source: ID_HOSPI)."
        tests: [not_null, unique]
      - name: consultation_id
        description: "FK to consultation (source: ID_CONSULT_hospi)."
        tests: [not_null]
      - name: room_number
        description: "Room number (source: NO_CHAMBRE_hospi)."
        tests: [not_null]
      - name: responsible_staff_id
        description: "Responsible staff member (source: ID_PERSONNEL_RESP)."
      - name: started_at
        description: "Hospitalisation start timestamp."
      - name: ended_at
        description: "Hospitalisation end timestamp. Nullable (ongoing stays)."
      - name: cost
        description: "Total hospitalisation cost in euros."

  - name: stg_personnel
    description: >
      Cleaned and renamed personnel records from the Staging layer.
      Type casting only, no business logic.
    columns:
      - name: staff_id
        description: "Unique staff identifier (source: ID_PERSONNEL)."
        tests: [not_null, unique]
      - name: last_name
        description: "Staff last name."
        tests: [not_null]
      - name: first_name
        description: "Staff first name."
        tests: [not_null]
      - name: job_title
        description: "Personnel function in the hospital."
        tests: [not_null]
      - name: work_start_at
        description: "Activity start timestamp."
        tests: [not_null]
      - name: work_end_at
        description: "Activity end timestamp, nullable for active staff."
      - name: work_end_reason
        description: "Reason for activity end."
      - name: created_at
        description: "Row creation timestamp in the source system."
        tests: [not_null]
      - name: updated_at
        description: "Last update timestamp in the source system."
        tests: [not_null]
      - name: status_code
        description: "Personnel status code."
        tests: [not_null]
