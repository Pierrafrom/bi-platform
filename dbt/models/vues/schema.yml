version: 2

models:
  - name: vw_avg_age_by_pathology
    description: >
      KPI 1 — Âge moyen des patients par pathologie et période.
      Une ligne par (pathologie, date de consultation). Utilisé pour filtrer dans Power BI.
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie diagnostiquée."
        tests: [not_null]
      - name: consultation_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: avg_age_at_consultation
        description: "Âge moyen des patients au moment de la consultation (arrondi à 1 décimale)."
        tests: [not_null]
      - name: patient_count
        description: "Nombre de patients distincts pour cette pathologie et cette période."
        tests: [not_null]

  - name: vw_top_medication_by_pathology
    description: >
      KPI 2 — Médicament le plus prescrit (en quantité) par pathologie et période.
      rank_by_quantity = 1 identifie le médicament numéro 1 par (pathologie, date de consultation).
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: consultation_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: medicine_code
        description: "Code du médicament."
        tests: [not_null]
      - name: medicine_name
        description: "Nom du médicament (depuis r_medc). Nullable si non référencé."
      - name: medicine_category
        description: "Catégorie du médicament."
        tests: [not_null]
      - name: manufacturer_brand
        description: "Marque du fabricant."
        tests: [not_null]
      - name: total_quantity
        description: "Quantité totale prescrite sur la période."
        tests: [not_null]
      - name: rank_by_quantity
        description: "Rang par quantité décroissante. 1 = médicament le plus prescrit."
        tests: [not_null]

  - name: vw_rooms_by_pathology
    description: >
      KPI 3 — Nombre de chambres distinctes ayant accueilli des patients
      diagnostiqués d'une certaine pathologie, par période.
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: consultation_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: room_count
        description: "Nombre de chambres distinctes ayant accueilli cette pathologie sur la période."
        tests: [not_null]

  - name: vw_doctor_speciality_by_pathology
    description: >
      KPI 4 — Proportion de médecins par spécialité ayant diagnostiqué une pathologie
      donnée, par période. specialty = job_title dans r_stf.
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: consultation_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: specialty
        description: "Spécialité du médecin (intitulé de poste)."
        tests: [not_null]
      - name: doctor_count
        description: "Nombre de médecins distincts de cette spécialité pour cette pathologie."
        tests: [not_null]
      - name: total_doctors
        description: "Total des médecins distincts pour cette pathologie et cette période."
        tests: [not_null]
      - name: doctor_proportion_pct
        description: "Proportion en % : doctor_count / total_doctors × 100."
        tests: [not_null]

  - name: vw_patients_one_night
    description: >
      KPI 5 — Proportion de patients hospitalisés ayant séjourné au moins une nuit,
      par période de début d'hospitalisation (duration_days >= 1).
    columns:
      - name: hospi_date
        description: "Date de début d'hospitalisation (Power BI en extrait année/mois)."
        tests: [not_null]
      - name: hospi_day
        description: "Jour du mois de début d'hospitalisation (1–31)."
        tests: [not_null]
      - name: total_hospitalisations
        description: "Nombre total d'hospitalisations sur la période."
        tests: [not_null]
      - name: one_night_plus_count
        description: "Nombre d'hospitalisations d'au moins une nuit."
        tests: [not_null]
      - name: one_night_plus_pct
        description: "Proportion en % : one_night_plus_count / total_hospitalisations × 100."
        tests: [not_null]

  - name: vw_empty_rooms
    description: >
      KPI 6 — Statut d'occupation de chaque chambre par période.
      Une ligne par (période, chambre). Filtrer sur occupancy_status = 'Libre' dans Power BI.
    columns:
      - name: hospi_date
        description: "Date de la période (Power BI en extrait année/mois)."
        tests: [not_null]
      - name: hospi_day
        description: "Jour du mois de la période (1–31)."
        tests: [not_null]
      - name: room_num
        description: "Numéro de chambre."
        tests: [not_null]
      - name: room_name
        description: "Nom de la chambre."
        tests: [not_null]
      - name: room_typ
        description: "Type de chambre."
      - name: buld_name
        description: "Nom du bâtiment."
      - name: occupancy_status
        description: "Statut d'occupation : 'Occupée' ou 'Libre'."
        tests:
          - not_null
          - accepted_values:
              values: ['Occupée', 'Libre']
