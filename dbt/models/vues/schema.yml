version: 2

models:
  - name: vw_avg_age_by_pathology
    description: >
      KPI 1 — Âge des patients au moment de la consultation, par pathologie.
      Grain détaillé : une ligne par consultation. Power BI agrège via
      AVERAGE(age_at_consultation) et DISTINCTCOUNT(patient_id).
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie diagnostiquée."
        tests: [not_null]
      - name: patient_id
        description: "Identifiant du patient."
        tests: [not_null]
      - name: report_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: age_at_consultation
        description: "Âge du patient au moment de la consultation (années révolues)."
        tests: [not_null]

  - name: vw_top_medication_by_pathology
    description: >
      KPI 2 — Quantités de médicaments prescrits par pathologie et période.
      Grain : une ligne par (pathologie, date, médicament). Power BI resomme
      total_quantity par médicament sur la période et classe via DAX (TOPN).
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: report_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: medicine_code
        description: "Code du médicament."
        tests: [not_null]
      - name: medicine_name
        description: "Nom du médicament (depuis r_medc, retombe sur medicine_code si non référencé)."
        tests: [not_null]
      - name: medicine_category
        description: "Catégorie du médicament."
        tests: [not_null]
      - name: manufacturer_brand
        description: "Marque du fabricant."
        tests: [not_null]
      - name: total_quantity
        description: "Quantité prescrite pour ce médicament, cette pathologie, ce jour."
        tests: [not_null]

  - name: vw_rooms_by_pathology
    description: >
      KPI 3 — Chambres ayant accueilli des patients diagnostiqués d'une
      certaine pathologie. Grain détaillé : une ligne par hospitalisation.
      Power BI compte les chambres distinctes via DISTINCTCOUNT(room_number).
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: room_number
        description: "Numéro de la chambre occupée durant l'hospitalisation."
        tests: [not_null]
      - name: report_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]

  - name: vw_doctor_speciality_by_pathology
    description: >
      KPI 4 — Médecins (par spécialité) ayant diagnostiqué une pathologie
      donnée. Grain détaillé : une ligne par consultation. specialty = job_title
      dans r_stf. Power BI agrège via DISTINCTCOUNT(staff_id) + mesure de
      proportion.
    columns:
      - name: pathology_description
        description: "Libellé de la pathologie."
        tests: [not_null]
      - name: staff_id
        description: "Identifiant du médecin ayant réalisé la consultation."
        tests: [not_null]
      - name: specialty
        description: "Spécialité du médecin (intitulé de poste)."
        tests: [not_null]
      - name: report_date
        description: "Date de la consultation (Power BI en extrait année/mois/jour)."
        tests: [not_null]

  - name: vw_patients_one_night
    description: >
      KPI 5 — Proportion de patients hospitalisés ayant séjourné au moins une nuit,
      par période de début d'hospitalisation (duration_days >= 1).
    columns:
      - name: report_date
        description: "Date de début d'hospitalisation (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: total_hospitalisations
        description: "Nombre total d'hospitalisations sur la période."
        tests: [not_null]
      - name: one_night_plus_count
        description: "Nombre d'hospitalisations d'au moins une nuit."
        tests: [not_null]
      - name: one_night_plus_pct
        description: "Proportion en % : one_night_plus_count / total_hospitalisations × 100."
        tests: [not_null]

  - name: vw_empty_rooms
    description: >
      KPI 6 — Statut d'occupation de chaque chambre par période.
      Une ligne par (période, chambre). Filtrer sur occupancy_status = 'Libre' dans Power BI.
    columns:
      - name: report_date
        description: "Date de la période (Power BI en extrait année/mois/jour)."
        tests: [not_null]
      - name: room_num
        description: "Numéro de chambre."
        tests: [not_null]
      - name: room_name
        description: "Nom de la chambre."
        tests: [not_null]
      - name: room_typ
        description: "Type de chambre."
      - name: buld_name
        description: "Nom du bâtiment."
      - name: occupancy_status
        description: "Statut d'occupation : 'Occupée' ou 'Libre'."
        tests:
          - not_null
          - accepted_values:
              values: ['Occupée', 'Libre']
